<!DOCTYPE html>
<html lang="tr" data-base-path="" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nest | Yönetim Paneli & SaaS Dashboard</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="admin-saas-body">
    <script>
        // Sayfa içeriğini admin auth kontrolü tamamlanana kadar gizle
        document.body.style.display = 'none';
    </script>

    <!-- Ana Mount Noktası -->
    <div id="admin-dashboard-mount" class="saas-mount-container">
        <!-- Auth onaylanınca Template buraya mount edilir -->
        <div class="saas-auth-spinner-box">
            <div class="saas-spinner"></div>
            <p>Yönetici oturumu ve Firestore güvenliği doğrulanıyor...</p>
        </div>
    </div>

    <!-- GÜVENLİ TEMPLATE: Yalnızca yetkili Admin doğrulaması sonrası JS ile mount edilir -->
    <template id="admin-dashboard-template">
        <div id="admin-dashboard-app" class="saas-app-layout">
            
            <!-- ================================================================= -->
            <!-- 1. SOL SABİT KENAR ÇUBUĞU (SIDEBAR) -->
            <!-- ================================================================= -->
            <aside class="saas-sidebar" id="saas-sidebar">
                <!-- Logo Bölümü -->
                <div class="saas-sidebar-brand">
                    <a href="index.html" class="saas-brand-link">
                        <div class="saas-brand-icon">
                            <i class="fa-solid fa-cube"></i>
                        </div>
                        <div class="saas-brand-text">
                            <span class="saas-brand-name">THE NEST</span>
                            <span class="saas-brand-badge">CONTROL HUB</span>
                        </div>
                    </a>
                    <button type="button" id="saas-sidebar-close-btn" class="saas-sidebar-mobile-close" aria-label="Menüyü Kapat">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Yönetici Profil Özeti Kartı -->
                <div class="saas-profile-card">
                    <div class="saas-avatar-wrapper">
                        <img id="sidebar-admin-avatar" src="images/favicon.png" alt="Admin Avatar" class="saas-avatar-img">
                        <span class="saas-status-dot saas-status-dot--online" title="Oturum Aktif"></span>
                    </div>
                    <div class="saas-profile-info">
                        <h4 id="admin-user-display" class="saas-profile-name">Yönetici</h4>
                        <span id="admin-email-display" class="saas-profile-email">admin@thenest.org</span>
                        <div class="saas-profile-tag">
                            <i class="fa-solid fa-shield-halved"></i> Super Admin
                        </div>
                    </div>
                </div>

                <!-- Navigasyon Menüsü -->
                <nav class="saas-nav-menu" aria-label="Dashboard Navigasyonu">
                    <div class="saas-nav-category">ANA MERKEZ</div>
                    <button type="button" class="saas-nav-item active" data-tab="dashboard" id="nav-tab-dashboard">
                        <i class="fa-solid fa-chart-pie saas-nav-icon"></i>
                        <span class="saas-nav-label">Genel Bakış & Metrikler</span>
                    </button>
                    <button type="button" class="saas-nav-item" data-tab="content" id="nav-tab-content">
                        <i class="fa-solid fa-layer-group saas-nav-icon"></i>
                        <span class="saas-nav-label">İçerik Yönetimi</span>
                        <span id="badge-content-count" class="saas-nav-badge">0</span>
                    </button>
                    <button type="button" class="saas-nav-item" data-tab="users" id="nav-tab-users">
                        <i class="fa-solid fa-users-gear saas-nav-icon"></i>
                        <span class="saas-nav-label">Kullanıcılar & Roller</span>
                        <span id="badge-user-count" class="saas-nav-badge">0</span>
                    </button>
                    <button type="button" class="saas-nav-item" data-tab="applications" id="nav-tab-applications">
                        <i class="fa-solid fa-id-card-clip saas-nav-icon"></i>
                        <span class="saas-nav-label">Takım Başvuruları</span>
                        <span id="pending-apps-count" class="saas-nav-badge saas-nav-badge--highlight" hidden>0</span>
                    </button>

                    <div class="saas-nav-category">SİSTEM & GÜVENLİK</div>
                    <button type="button" class="saas-nav-item" data-tab="security" id="nav-tab-security">
                        <i class="fa-solid fa-shield-virus saas-nav-icon"></i>
                        <span class="saas-nav-label">Güvenlik & Denetim</span>
                        <span class="saas-nav-indicator saas-indicator--green"></span>
                    </button>
                    <button type="button" class="saas-nav-item" data-tab="backups" id="nav-tab-backups">
                        <i class="fa-solid fa-clock-rotate-left saas-nav-icon"></i>
                        <span class="saas-nav-label">Yedekleme & Restore</span>
                        <span id="badge-snapshots-count" class="saas-nav-badge">0</span>
                    </button>
                    <button type="button" class="saas-nav-item" data-tab="settings" id="nav-tab-settings">
                        <i class="fa-solid fa-sliders saas-nav-icon"></i>
                        <span class="saas-nav-label">Site Ayarları</span>
                    </button>
                </nav>

                <!-- Sidebar Alt Butonlar -->
                <div class="saas-sidebar-footer">
                    <a href="index.html" target="_blank" class="saas-footer-btn saas-btn--preview" title="Web Sitesini Yeni Sekmede Aç">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>Site Önizleme</span>
                    </a>
                    <button type="button" id="admin-logout-btn" class="saas-footer-btn saas-btn--logout" title="Güvenli Oturumu Kapat">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Çıkış Yap</span>
                    </button>
                </div>
            </aside>

            <!-- ================================================================= -->
            <!-- 2. ANA İÇERİK ALANI (MAIN CONTENT & HEADER) -->
            <!-- ================================================================= -->
            <div class="saas-main-wrapper">
                
                <!-- ÜST BAR (HEADER) -->
                <header class="saas-top-header">
                    <div class="saas-header-left">
                        <button type="button" id="saas-mobile-toggle-btn" class="saas-hamburger-btn" aria-label="Menüyü Aç">
                            <i class="fa-solid fa-bars-staggered"></i>
                        </button>
                        
                        <!-- Arama Çubuğu -->
                        <div class="saas-search-box">
                            <i class="fa-solid fa-magnifying-glass saas-search-icon"></i>
                            <input type="text" id="saas-global-search" placeholder="İçerik, kullanıcı, başvuru veya ayar ara..." aria-label="Global Arama">
                            <kbd class="saas-search-shortcut">ESC</kbd>
                        </div>
                    </div>

                    <div class="saas-header-right">
                        <!-- Canlı Sistem Durum Göstergesi -->
                        <div class="saas-health-pills">
                            <div class="saas-health-pill" id="health-db-pill" title="Firestore Veritabanı Durumu">
                                <span class="saas-pulse-dot saas-pulse-dot--green"></span>
                                <span class="saas-health-text">DB: <strong>Firestore</strong></span>
                            </div>
                            <div class="saas-health-pill" id="health-api-pill" title="API Sunucu Sağlığı">
                                <span class="saas-pulse-dot saas-pulse-dot--green"></span>
                                <span class="saas-health-text">API: <strong>Healthy (200)</strong></span>
                            </div>
                            <div class="saas-health-pill saas-health-pill--latency" id="health-latency-pill">
                                <i class="fa-solid fa-bolt text-yellow"></i>
                                <span id="health-latency-val">12ms</span>
                            </div>
                        </div>

                        <!-- Hızlı Yenile Butonu -->
                        <button type="button" id="saas-refresh-btn" class="saas-icon-btn" title="Verileri Yenile">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>

                        <!-- Hızlı Bildirim & Durum Menüsü -->
                        <button type="button" id="saas-quick-alerts-btn" class="saas-icon-btn saas-icon-btn--notify" title="Güvenlik Bildirimleri">
                            <i class="fa-solid fa-bell"></i>
                            <span class="saas-notify-bubble" id="saas-notify-count">1</span>
                        </button>
                    </div>
                </header>

                <!-- Genel Geri Bildirim Banner'ı -->
                <div id="admin-feedback" class="saas-alert-banner" role="alert" hidden></div>

                <!-- ANA İÇERİK GÖVDESİ -->
                <main class="saas-content-body">

                    <!-- ========================================================= -->
                    <!-- SEKME 1: DASHBOARD / GENEL BAKIŞ -->
                    <!-- ========================================================= -->
                    <section id="tab-dashboard" class="saas-tab-panel active">
                        <!-- Dashboard Başlık ve Hızlı İşlem Barı -->
                        <div class="saas-page-header">
                            <div>
                                <h1 class="saas-page-title">Yönetim & Analiz Merkezi</h1>
                                <p class="saas-page-desc">The Nest platformunun anlık istatistikleri, içerik durumu ve güvenlik akışı.</p>
                            </div>
                            <div class="saas-quick-action-btns">
                                <button type="button" id="dash-btn-add-content" class="saas-btn saas-btn--primary">
                                    <i class="fa-solid fa-plus"></i> Yeni İçerik Ekle
                                </button>
                                <button type="button" id="dash-btn-run-audit" class="saas-btn saas-btn--outline">
                                    <i class="fa-solid fa-shield-halved"></i> Güvenlik Denetimi
                                </button>
                            </div>
                        </div>

                        <!-- 4'lü SaaS Metrik Kartları -->
                        <div class="saas-metrics-grid">
                            <!-- Kart 1: Toplam Kullanıcı -->
                            <div class="saas-metric-card">
                                <div class="saas-metric-top">
                                    <span class="saas-metric-label">TOPLAM KULLANICI</span>
                                    <div class="saas-metric-icon saas-icon--blue">
                                        <i class="fa-solid fa-users"></i>
                                    </div>
                                </div>
                                <div class="saas-metric-val-row">
                                    <span id="metric-total-users" class="saas-metric-number">0</span>
                                    <span id="metric-user-growth" class="saas-growth-badge saas-growth--up">
                                        <i class="fa-solid fa-arrow-trend-up"></i> +0%
                                    </span>
                                </div>
                                <div class="saas-metric-footer">
                                    <span class="saas-subtext">Son 7 günde <strong id="metric-recent-users">0</strong> yeni kayıt</span>
                                </div>
                            </div>

                            <!-- Kart 2: Aktif İçerik / Gönderi -->
                            <div class="saas-metric-card">
                                <div class="saas-metric-top">
                                    <span class="saas-metric-label">YAYINLANAN İÇERİKLER</span>
                                    <div class="saas-metric-icon saas-icon--green">
                                        <i class="fa-solid fa-book-open-reader"></i>
                                    </div>
                                </div>
                                <div class="saas-metric-val-row">
                                    <span id="metric-total-content" class="saas-metric-number">0</span>
                                    <span class="saas-growth-badge saas-growth--neutral">
                                        <i class="fa-solid fa-circle-check"></i> Aktif
                                    </span>
                                </div>
                                <div class="saas-metric-footer">
                                    <span class="saas-subtext">Dersler, makaleler, CAD & haberler</span>
                                </div>
                            </div>

                            <!-- Kart 3: Şifre Sıfırlama İstekleri & Güvenlik Logları -->
                            <div class="saas-metric-card">
                                <div class="saas-metric-top">
                                    <span class="saas-metric-label">ŞİFRE SIFIRLAMA & LOGLAR</span>
                                    <div class="saas-metric-icon saas-icon--amber">
                                        <i class="fa-solid fa-key"></i>
                                    </div>
                                </div>
                                <div class="saas-metric-val-row">
                                    <span id="metric-password-resets" class="saas-metric-number">0</span>
                                    <span class="saas-growth-badge saas-growth--secure">
                                        <i class="fa-solid fa-shield"></i> Loglandı
                                    </span>
                                </div>
                                <div class="saas-metric-footer">
                                    <span class="saas-subtext">Kayıtlı sıfırlama & auth logları</span>
                                </div>
                            </div>

                            <!-- Kart 4: Takım Başvuruları -->
                            <div class="saas-metric-card">
                                <div class="saas-metric-top">
                                    <span class="saas-metric-label">TAKIM BAŞVURULARI</span>
                                    <div class="saas-metric-icon saas-icon--purple">
                                        <i class="fa-solid fa-id-card"></i>
                                    </div>
                                </div>
                                <div class="saas-metric-val-row">
                                    <span id="metric-total-apps" class="saas-metric-number">0</span>
                                    <span id="metric-pending-badge" class="saas-growth-badge saas-growth--amber">
                                        <strong id="metric-pending-apps">0</strong> Bekleyen
                                    </span>
                                </div>
                                <div class="saas-metric-footer">
                                    <span class="saas-subtext">Aday öğrenci başvuru formları</span>
                                </div>
                            </div>
                        </div>

                        <!-- 2 Kolonlu Dashboard İkincil Grid -->
                        <div class="saas-dashboard-grid">
                            
                            <!-- Sol: Son Giriş Yapanlar & Aktif Oturumlar -->
                            <div class="saas-glass-card">
                                <div class="saas-glass-card-header">
                                    <div class="saas-card-title-group">
                                        <i class="fa-solid fa-clock-rotate-left text-blue"></i>
                                        <h3>Son Giriş Yapanlar & Aktif Hesaplar</h3>
                                    </div>
                                    <button type="button" class="saas-link-btn" id="dash-view-all-users">Tümünü Gör</button>
                                </div>
                                <div class="saas-glass-card-body">
                                    <div id="dash-active-users-list" class="saas-user-activity-list">
                                        <div class="saas-loading-row"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor...</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Sağ: Son Aktiviteler Akışı (Activity Feed / Audit) -->
                            <div class="saas-glass-card">
                                <div class="saas-glass-card-header">
                                    <div class="saas-card-title-group">
                                        <i class="fa-solid fa-list-check text-purple"></i>
                                        <h3>Sistem Aktivite Akışı (Audit Logs)</h3>
                                    </div>
                                    <span class="saas-badge-live">CANLI</span>
                                </div>
                                <div class="saas-glass-card-body">
                                    <div id="dash-activity-feed" class="saas-activity-feed">
                                        <div class="saas-loading-row"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor...</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Kategori Dağılım Çubukları & Sistem Özeti -->
                        <div class="saas-glass-card mt-6">
                            <div class="saas-glass-card-header">
                                <div class="saas-card-title-group">
                                    <i class="fa-solid fa-chart-column text-green"></i>
                                    <h3>İçerik Türü & Kategori Dağılımı</h3>
                                </div>
                            </div>
                            <div class="saas-glass-card-body">
                                <div id="dash-content-breakdown" class="saas-breakdown-grid">
                                    <!-- Dinamik olarak JS ile doldurulur -->
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ========================================================= -->
                    <!-- SEKME 2: İÇERİK YÖNETİMİ -->
                    <!-- ========================================================= -->
                    <section id="tab-content" class="saas-tab-panel">
                        <div class="saas-glass-card">
                            <div class="saas-glass-card-header">
                                <div>
                                    <h2 class="saas-card-heading"><i class="fa-solid fa-layer-group text-blue"></i> İçerik ve Eğitim Kütüphanesi</h2>
                                    <p class="saas-card-subheading">Dersler, teknik makaleler, CAD tasarımları, sunumlar ve duyuruları yönetin.</p>
                                </div>
                                <div class="saas-card-actions">
                                    <button type="button" id="content-toggle-add-btn" class="saas-btn saas-btn--primary">
                                        <i class="fa-solid fa-plus"></i> Yeni İçerik Ekle
                                    </button>
                                </div>
                            </div>

                            <!-- Sayfa İçi Inline / Modal İçerik Ekleme & Düzenleme Formu -->
                            <div id="content-inline-panel" class="saas-inline-form-box" hidden>
                                <div class="saas-inline-form-header">
                                    <h3 id="content-form-title"><i class="fa-solid fa-pen-to-square"></i> Yeni İçerik Ekle</h3>
                                    <button type="button" id="content-form-close-btn" class="saas-close-btn">&times;</button>
                                </div>
                                <form id="content-form" class="saas-form" novalidate>
                                    <input type="hidden" id="content-id">

                                    <div class="saas-form-row saas-form-row--2col">
                                        <div class="saas-form-group">
                                            <label for="content-type">İçerik Türü</label>
                                            <select id="content-type" class="saas-select" required>
                                                <option value="ders">Ders / Eğitim Modülü</option>
                                                <option value="makale">Teknik Makale</option>
                                                <option value="sunum">Sunum & Slayt</option>
                                                <option value="obje">Obje / CAD & 3D Tasarım</option>
                                                <option value="haber">Haber & Duyuru</option>
                                            </select>
                                        </div>
                                        <div class="saas-form-group">
                                            <label for="content-category">Kategori / Departman</label>
                                            <select id="content-category" class="saas-select" required>
                                                <option value="Mekanik">Mekanik</option>
                                                <option value="Yazılım">Yazılım</option>
                                                <option value="Sunum Becerileri">Sunum Becerileri</option>
                                                <option value="Tasarım">Tasarım & CAD</option>
                                                <option value="Sponsorluk">Sponsorluk & Bütçe</option>
                                                <option value="Elektronik">Elektronik & Güç</option>
                                                <option value="FRC">FRC Robotik</option>
                                                <option value="FYF">FYF</option>
                                                <option value="Duyuru">Duyuru</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="saas-form-row">
                                        <div class="saas-form-group">
                                            <label for="content-title">Başlık</label>
                                            <input type="text" id="content-title" class="saas-input" required minlength="2" maxlength="255" placeholder="Örn: Swerve Drive Şase Montajı ve PID Kalibrasyonu">
                                        </div>
                                    </div>

                                    <div class="saas-form-row">
                                        <div class="saas-form-group">
                                            <label for="content-summary">Kısa Kart Özeti</label>
                                            <textarea id="content-summary" class="saas-textarea" rows="2" maxlength="1000" placeholder="Kullanıcı kartında görünecek 1-2 cümlelik açıklama"></textarea>
                                        </div>
                                    </div>

                                    <div class="saas-form-row">
                                        <div class="saas-form-group">
                                            <label for="content-body">Detaylı İçerik (Gövde Metni / Müfredat Maddeleri)</label>
                                            <textarea id="content-body" class="saas-textarea" rows="6" maxlength="50000" placeholder="Eğitim adımları, teknik formüller veya detaylı makale metni..."></textarea>
                                        </div>
                                    </div>

                                    <div class="saas-form-row saas-form-row--2col">
                                        <div class="saas-form-group">
                                            <label for="content-image-url">Kapak Görsel Yolu</label>
                                            <input type="text" id="content-image-url" class="saas-input" placeholder="images/mk/1.jpg">
                                        </div>
                                        <div class="saas-form-group">
                                            <label for="content-file-url">Ekli Dosya / PDF / CAD Yolu</label>
                                            <input type="text" id="content-file-url" class="saas-input" placeholder="assets/pdf/makale1.pdf">
                                        </div>
                                    </div>

                                    <div class="saas-form-row">
                                        <label class="saas-checkbox-pill">
                                            <input type="checkbox" id="content-published" checked>
                                            <span>Bu içeriği hemen sitede yayına al</span>
                                        </label>
                                    </div>

                                    <div id="content-form-feedback" class="saas-form-feedback" hidden></div>

                                    <div class="saas-form-actions">
                                        <button type="button" id="content-cancel-btn" class="saas-btn saas-btn--ghost">İptal</button>
                                        <button type="submit" id="content-save-btn" class="saas-btn saas-btn--primary">
                                            <i class="fa-solid fa-floppy-disk"></i> İçeriği Kaydet
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Filtre ve Arama Çubuğu -->
                            <div class="saas-table-toolbar">
                                <div class="saas-filter-wrapper">
                                    <div class="saas-filter-item">
                                        <label for="content-type-filter"><i class="fa-solid fa-filter"></i> Tür:</label>
                                        <select id="content-type-filter" class="saas-select-sm">
                                            <option value="">Tüm Türler</option>
                                            <option value="ders">Dersler</option>
                                            <option value="makale">Makaleler</option>
                                            <option value="sunum">Sunumlar</option>
                                            <option value="obje">Objeler / CAD</option>
                                            <option value="haber">Haber & Duyuru</option>
                                        </select>
                                    </div>
                                    <div class="saas-filter-item">
                                        <label for="content-cat-filter"><i class="fa-solid fa-tags"></i> Kategori:</label>
                                        <select id="content-cat-filter" class="saas-select-sm">
                                            <option value="">Tüm Kategoriler</option>
                                            <option value="Mekanik">Mekanik</option>
                                            <option value="Yazılım">Yazılım</option>
                                            <option value="Sunum Becerileri">Sunum Becerileri</option>
                                            <option value="Tasarım">Tasarım</option>
                                            <option value="Sponsorluk">Sponsorluk</option>
                                            <option value="Elektronik">Elektronik</option>
                                            <option value="FRC">FRC</option>
                                            <option value="FYF">FYF</option>
                                            <option value="Duyuru">Duyuru</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="saas-search-mini">
                                    <input type="text" id="content-table-search" placeholder="İçerik başlığında ara..." class="saas-input-sm">
                                </div>
                            </div>

                            <!-- Data Table -->
                            <div class="saas-table-responsive">
                                <table class="saas-table">
                                    <thead>
                                        <tr>
                                            <th>İçerik Başlığı & Özet</th>
                                            <th>Tür & Kategori</th>
                                            <th>Durum</th>
                                            <th>Yazar</th>
                                            <th>Son Güncelleme</th>
                                            <th class="text-right">İşlemler</th>
                                        </tr>
                                    </thead>
                                    <tbody id="content-tbody">
                                        <tr><td colspan="6" class="saas-table-loading"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor...</td></tr>
                                    </tbody>
