<!DOCTYPE html>
<html lang="tr" data-base-path="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title.forgot">The Nest | Şifremi Unuttum</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
    <link rel="stylesheet" media="(max-width:1024px)" href="css/tablet.css">
    <link rel="stylesheet" media="(max-width:500px)" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app-header" data-component="header"></div>

    <main class="auth-page">
        <div class="auth-card">
            <i class="fa-solid fa-key auth-icon"></i>
            <h1 data-i18n="auth.forgot.title">Şifremi Unuttum</h1>
            <p class="auth-lead" data-i18n="auth.forgot.lead">E-posta adresini gir, sana şifre sıfırlama bağlantısı oluşturalım.</p>

            <form id="forgot-password-form" class="auth-form" novalidate>
                <label for="email" data-i18n="auth.forgot.email">E-posta</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

                <button type="submit" id="forgot-password-submit" data-i18n="auth.forgot.submit">Şifremi Sıfırla</button>
            </form>

            <p class="auth-switch"><a href="login.html" data-i18n="auth.forgot.backLink">Giriş sayfasına dön</a></p>
        </div>
    </main>

    <div id="app-footer" data-component="footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
