<!DOCTYPE html>
<html lang="tr" data-base-path="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nest | Şifremi Unuttum</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
    <link rel="stylesheet" media="(max-width:1024px)" href="css/tablet.css">
    <link rel="stylesheet" media="(max-width:500px)" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app-header" data-component="header"></div>

    <main class="auth-page">
        <div class="auth-card">
            <i class="fa-solid fa-key auth-icon"></i>
            <h1>Şifremi Unuttum</h1>
            <p class="auth-lead">E-posta adresini gir, sana şifre sıfırlama bağlantısı oluşturalım.</p>

            <form id="forgot-password-form" class="auth-form" novalidate>
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

                <div id="reset-link-box" style="display:none; margin: 16px 0; padding: 14px; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 8px; text-align: center;">
                    <p style="font-size: 13px; color: #1e3a8a; margin-bottom: 8px;">🔥 Firebase Şifre Sıfırlama Bağlantısı:</p>
                    <a id="reset-link-btn" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 8px 16px; background: #2563eb; color: #ffffff; border-radius: 6px; font-weight: 600; font-size: 13px; text-decoration: none;">Şifreyi Şimdi Sıfırla</a>
                </div>

                <button type="submit" id="forgot-password-submit">Sıfırlama Bağlantısı Gönder</button>
            </form>

            <p class="auth-switch"><a href="login.html">Giriş sayfasına dön</a></p>
        </div>
    </main>

    <div id="app-footer" data-component="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
