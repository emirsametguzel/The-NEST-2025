<!DOCTYPE html>
<html lang="tr" data-base-path="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nest | Giriş Yap</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
    <link rel="stylesheet" media="(max-width:1024px)" href="css/tablet.css">
    <link rel="stylesheet" media="(max-width:500px)" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app-header" data-component="header"></div>

    <main class="auth-page">
        <div class="auth-card">
            <i class="fa-solid fa-right-to-bracket auth-icon"></i>
            <h1>Giriş Yap</h1>
            <p class="auth-lead">Hesabınla giriş yap ve profiline eriş.</p>

            <form id="login-form" class="auth-form" novalidate>
                <label for="identifier">Kullanıcı Adı veya E-posta</label>
                <input type="text" id="identifier" name="identifier" autocomplete="username" required>

                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

                <button type="submit" id="login-submit">Giriş Yap</button>
            </form>

            <p class="auth-switch"><a href="forgot-password.html">Şifremi unuttum</a></p>
            <p class="auth-switch">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
        </div>
    </main>

    <div id="app-footer" data-component="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
