<!DOCTYPE html>
<html lang="tr" data-base-path="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title.reset">The Nest | Şifre Sıfırla</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
    <link rel="stylesheet" media="(max-width:1024px)" href="css/tablet.css">
    <link rel="stylesheet" media="(max-width:500px)" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app-header" data-component="header"></div>

    <main class="auth-page">
        <div class="auth-card">
            <i class="fa-solid fa-lock-open auth-icon"></i>
            <h1 data-i18n="auth.reset.title">Şifre Sıfırla</h1>
            <p class="auth-lead" data-i18n="auth.reset.lead">E-postana gelen 6 haneli kodu ve yeni şifreni gir.</p>

            <form id="reset-password-form" class="auth-form" novalidate>
                <label for="email" data-i18n="auth.reset.email">E-posta</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="otp" data-i18n="auth.reset.otp">Doğrulama Kodu</label>
                <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
                <p class="auth-hint" data-i18n="auth.reset.otpHint">6 haneli kod 10 dakika geçerlidir.</p>

                <label for="newPassword" data-i18n="auth.reset.newPassword">Yeni Şifre</label>
                <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
                <p class="auth-hint" data-i18n="auth.reset.passwordHint">En az 8 karakter; en az bir büyük harf ve bir rakam içermeli.</p>

                <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

                <button type="submit" id="reset-password-submit" data-i18n="auth.reset.submit">Şifreyi Güncelle</button>
            </form>

            <p class="auth-switch"><a href="forgot-password.html" data-i18n="auth.reset.resendLink">Kodu tekrar gönder</a></p>
            <p class="auth-switch"><a href="login.html" data-i18n="auth.reset.loginLink">Giriş sayfasına dön</a></p>
        </div>
    </main>

    <div id="app-footer" data-component="footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
